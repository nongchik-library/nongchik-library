name: nongchik_library
description: ระบบคลังข้อมูล ห้องสมุดประชาชนอำเภอหนองจิก
publish_to: "none"
version: 1.0.0+72
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  geolocator: ^13.0.4
  url_launcher: ^6.3.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansThai-Regular.ttf
    - assets/fonts/NotoSansThai-Bold.ttf
  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700
